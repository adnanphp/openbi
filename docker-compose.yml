services:

  # ----------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    container_name: openbi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbi}
      POSTGRES_DB: ${POSTGRES_DB:-openbi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - openbi_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------- superset
  superset:
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    container_name: openbi-superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-openbi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-openbi}
      DATABASE_DB: ${POSTGRES_DB:-openbi}
      SUPERSET_ENV: production
      SUPERSET_LOAD_EXAMPLES: "false"
      PYTHONPATH: /app/pythonpath
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    command: >
      /bin/sh -c "
        superset db upgrade &&
        superset fab create-admin
          --username admin
          --firstname Admin
          --lastname User
          --email admin@openbi.local
          --password admin || true &&
        superset init &&
        /usr/bin/run-server.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  openbi_pgdata:
  superset_home:
