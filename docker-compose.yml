services:

  # ----------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    container_name: openbi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbi}
      POSTGRES_DB: ${POSTGRES_DB:-openbi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - openbi_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------- superset
  superset:
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    container_name: openbi-superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-openbi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-openbi}
      DATABASE_DB: ${POSTGRES_DB:-openbi}
      SUPERSET_ENV: production
      SUPERSET_LOAD_EXAMPLES: "false"
      PYTHONPATH: /app/pythonpath
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    command: >
      /bin/sh -c "
        superset db upgrade &&
        superset fab create-admin
          --username admin
          --firstname Admin
          --lastname User
          --email admin@openbi.local
          --password admin || true &&
        superset init &&
        /usr/bin/run-server.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s


  airflow:
    image: apache/airflow:2.9.1-python3.11
    container_name: openbi-airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://openbi:openbi@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PARALLELISM: 4
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
      AIRFLOW__METRICS__STATSD_ON: "True"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: 9125
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
    ports:
      - "8090:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./airflow/logs:/opt/airflow/logs
      - airflow_home:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "
        airflow db init &&
        (airflow users create
          --username admin --firstname Admin --lastname User
          --role Admin --email admin@openbi.local --password admin || true) &&
        airflow webserver & airflow scheduler
      "



  # -------------------- MONITORING --------------------
  statsd-exporter:
    image: prom/statsd-exporter:v0.26.1
    container_name: openbi-statsd-exporter
    ports:
      - "9125:9125/udp"
      - "9102:9102"
    command:
      - "--statsd.mapping-config=/etc/statsd/mapping.yaml"
    volumes:
      - ./monitoring/statsd/mapping.yaml:/etc/statsd/mapping.yaml:ro

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: openbi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - statsd-exporter

  openbi-exporter:
    build:
      context: .
      dockerfile: Dockerfile.exporter
    container_name: openbi-exporter
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: openbi
      POSTGRES_USER: openbi
      POSTGRES_PASSWORD: openbi
      DATABASE_URL: postgresql+psycopg2://openbi:openbi@postgres:5432/openbi
      EXPORTER_PORT: 9103
      EXPORTER_INTERVAL: 30
    ports:
      - "9103:9103"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: openbi-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus


volumes:
  openbi_pgdata:
  superset_home:
  airflow_home:
  prometheus_data:
  grafana_data:
