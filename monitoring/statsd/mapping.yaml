mappings:
  - match: "airflow.dag.*.*.duration"
    name: "airflow_dag_duration_seconds"
    labels:
      dag_id: "$1"
      state: "$2"

  - match: "airflow.dag.*.*.duration"
    match_metric_type: observer
    name: "airflow_dag_duration_seconds"
    labels:
      dag_id: "$1"
      state: "$2"

  - match: "airflow.ti.*.*.*.duration"
    name: "airflow_task_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"

  - match: "airflow.dag_processing.*.*"
    name: "airflow_dag_processing_total"
    labels:
      file_path: "$1"
      status: "$2"

  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat_total"

  - match: "airflow.executor.*"
    name: "airflow_executor_total"
    labels:
      state: "$1"

  # catch-all
  - match: "airflow.*"
    name: "airflow_${1}"
