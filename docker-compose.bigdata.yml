# Extends docker-compose.yml — run with:
#   docker compose -f docker-compose.yml -f docker-compose.bigdata.yml up -d

services:

  # -------------------- SPARK MASTER --------------------
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: openbi-spark-master
    hostname: spark-master
    environment:
      SPARK_MODE: master
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "7077:7077"      # Spark master RPC
      - "8080:8080"      # Spark master Web UI
    volumes:
      - ./spark/jobs:/opt/openbi/jobs
      - ./spark/sql:/opt/openbi/sql
      - ./spark/conf:/opt/openbi/conf
      - ./spark/tests:/opt/openbi/tests
      - ./data:/opt/openbi/data
    networks:
      - default

  # -------------------- SPARK WORKERS --------------------
  spark-worker-1:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: openbi-spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 3G
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./spark/jobs:/opt/openbi/jobs
      - ./spark/sql:/opt/openbi/sql
      - ./spark/conf:/opt/openbi/conf
      - ./spark/tests:/opt/openbi/tests
      - ./data:/opt/openbi/data
    networks:
      - default

  spark-worker-2:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: openbi-spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 3G
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: 8082
    ports:
      - "8082:8082"
    volumes:
      - ./spark/jobs:/opt/openbi/jobs
      - ./spark/sql:/opt/openbi/sql
      - ./spark/conf:/opt/openbi/conf
      - ./spark/tests:/opt/openbi/tests
      - ./data:/opt/openbi/data
    networks:
      - default
