# OpenBI Spark defaults
spark.sql.extensions                   io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog        org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.warehouse.dir                /opt/openbi/data/warehouse
spark.databricks.delta.retentionDurationCheck.enabled false

# Parallelism
spark.sql.shuffle.partitions           16
spark.default.parallelism              16
spark.sql.adaptive.enabled             true
spark.sql.adaptive.coalescePartitions.enabled true

# Memory — bigger driver/executor for the 1M-row joins
spark.driver.memory                    3g
spark.executor.memory                  3g
spark.executor.memoryOverhead          512m

# Derby metastore in /tmp (writable)
spark.driver.extraJavaOptions          -Dderby.system.home=/tmp
spark.sql.hive.metastore.jars          builtin
