apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: superset-home
  namespace: openbi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: openbi
  labels:
    app: superset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      initContainers:
        - name: init-superset
          image: apache/superset:3.1.3
          command:
            - /bin/bash
            - -c
            - |
              set -e
              superset db upgrade
              superset fab create-admin \
                --username admin \
                --firstname Admin \
                --lastname User \
                --email admin@openbi.local \
                --password admin || true
              superset init
          env:
            - name: SUPERSET_SECRET_KEY
              value: "openbi-secret-key-change-me-in-prod"
            - name: SUPERSET_LOAD_EXAMPLES
              value: "false"
            - name: FLASK_APP
              value: "superset.app:create_app()"
          volumeMounts:
            - name: superset-home
              mountPath: /app/superset_home
      containers:
        - name: superset
          image: apache/superset:3.1.3
          command:
            - /usr/bin/run-server.sh
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          env:
            - name: SUPERSET_SECRET_KEY
              value: "openbi-secret-key-change-me-in-prod"
            - name: SUPERSET_LOAD_EXAMPLES
              value: "false"
            - name: FLASK_APP
              value: "superset.app:create_app()"
            - name: SUPERSET_BIND_ADDRESS
              value: "0.0.0.0"
            - name: SUPERSET_PORT
              value: "8088"
            - name: SERVER_WORKER_AMOUNT
              value: "1"
            - name: SERVER_THREADS_AMOUNT
              value: "20"
            - name: GUNICORN_TIMEOUT
              value: "120"
          volumeMounts:
            - name: superset-home
              mountPath: /app/superset_home
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: superset-home
          persistentVolumeClaim:
            claimName: superset-home
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: openbi
spec:
  selector:
    app: superset
  ports:
    - name: http
      port: 8088
      targetPort: http
  type: ClusterIP
